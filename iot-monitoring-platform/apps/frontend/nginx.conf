server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression ────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # ── API Gateway → auth, swagger ────────────────────────────────────────
    location /api/v1/auth/ {
        proxy_pass         http://api-gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/docs {
        proxy_pass         http://api-gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Device Service ──────────────────────────────────────────────────────
    location /api/v1/devices/ {
        proxy_pass         http://device-service:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Analytics Service ───────────────────────────────────────────────────
    location /api/v1/analytics/ {
        proxy_pass         http://analytics-service:3002;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Alerts Service → rules + alerts ────────────────────────────────────
    location /api/v1/rules/ {
        proxy_pass         http://alerts-service:3003;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/v1/alerts/ {
        proxy_pass         http://alerts-service:3003;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Notification Service → SSE stream ──────────────────────────────────
    # SSE requires disabled buffering and long-lived connections
    location /api/v1/notifications/ {
        proxy_pass             http://notification-service:3004;
        proxy_http_version     1.1;
        proxy_set_header       Host                $host;
        proxy_set_header       X-Real-IP           $remote_addr;
        proxy_set_header       X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto   $scheme;

        # SSE: disable buffering, keep connection alive
        proxy_set_header       Connection          '';
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     86400s;
        chunked_transfer_encoding on;

        # Prevent nginx from adding "X-Accel-Buffering: yes"
        add_header             X-Accel-Buffering   no;
    }

    # ── React Router (HTML5 history) ────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
