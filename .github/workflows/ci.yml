name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: lint + test + build ────────────────────────────────────────────
  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iot-monitoring-platform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: iot-monitoring-platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint -- --max-warnings 0
        continue-on-error: true

      - name: Run unit tests
        run: npx jest --passWithNoTests --forceExit --testPathPattern="test/"

      - name: Build all services
        run: npm run build:all

  # ── Frontend: test + build ──────────────────────────────────────────────────
  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: iot-monitoring-platform/apps/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: iot-monitoring-platform/apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm test

      - name: Build
        run: npm run build

  # ── Docker: build all images ─────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build api-gateway image
        uses: docker/build-push-action@v5
        with:
          context: ./iot-monitoring-platform
          file: ./iot-monitoring-platform/apps/api-gateway/Dockerfile
          push: false
          tags: iot-api-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build device-service image
        uses: docker/build-push-action@v5
        with:
          context: ./iot-monitoring-platform
          file: ./iot-monitoring-platform/apps/device-service/Dockerfile
          push: false
          tags: iot-device-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build analytics-service image
        uses: docker/build-push-action@v5
        with:
          context: ./iot-monitoring-platform
          file: ./iot-monitoring-platform/apps/analytics-service/Dockerfile
          push: false
          tags: iot-analytics-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build alerts-service image
        uses: docker/build-push-action@v5
        with:
          context: ./iot-monitoring-platform
          file: ./iot-monitoring-platform/apps/alerts-service/Dockerfile
          push: false
          tags: iot-alerts-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build notification-service image
        uses: docker/build-push-action@v5
        with:
          context: ./iot-monitoring-platform
          file: ./iot-monitoring-platform/apps/notification-service/Dockerfile
          push: false
          tags: iot-notification-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./iot-monitoring-platform/apps/frontend
          file: ./iot-monitoring-platform/apps/frontend/Dockerfile
          push: false
          tags: iot-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
